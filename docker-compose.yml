services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-laundry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-laundry123}
      POSTGRES_DB: ${POSTGRES_DB:-laundry}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # 数据库不发布到宿主端口，仅在 compose 内部网络访问
    networks:
      - internal

  app:
    build: .
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-laundry}:${POSTGRES_PASSWORD:-laundry123}@db:5432/${POSTGRES_DB:-laundry}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
    ports:
      - "${CC_PUBLISH_PORT}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - internal

networks:
  internal:

volumes:
  pgdata:
